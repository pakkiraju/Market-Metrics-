# Render Blueprint - Market Metrics Dashboard
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: market-metrics-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: FINVIZ_API_KEY
        sync: false  # Set manually in Render dashboard
